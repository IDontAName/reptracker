<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honor Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c0b10;--ink2:#14121b;--panel:#1b1825;--panel2:#221e2e;
  --edge:#352f45;--edge2:#4a4060;
  --gold:#c9a24b;--gold-dim:#8a7232;--parch:#e8dcc0;--parch-dim:#b6a888;
  --blood:#9e2b2b;--blood-bright:#c8413f;
  --pos:#4f9d6b;--pos-bright:#6fcf91;--neutral:#6b6478;
  --txt:#e8dcc0;--txt-dim:#9d9482;--txt-faint:#6f6a5e;
  --rad:4px;--shadow:0 10px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'EB Garamond',Georgia,serif;color:var(--txt);min-height:100%;overflow-x:hidden;
  background:linear-gradient(rgba(10,9,16,.86),rgba(10,9,16,.93)),url('Banner%20Art%20(Upscaled).jpg') center/cover fixed no-repeat,#0a0910}
h1,h2,h3,h4{font-family:'Cinzel',serif;letter-spacing:.02em}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}
input,select,textarea{font-family:inherit}
::selection{background:var(--gold-dim);color:#0a0910}

/* login */
#loginScreen{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(rgba(6,4,14,.45),rgba(6,4,14,.7)),url('Banner%20Art%20(Upscaled).jpg') center/cover no-repeat,#0a0910}
.login-card{width:min(420px,92%);background:linear-gradient(180deg,rgba(27,24,37,.97),rgba(12,11,16,.98));
  border:1px solid var(--edge2);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.75),0 0 0 1px rgba(201,162,75,.08);padding:40px 34px 32px}
.login-logo{text-align:center;margin-bottom:22px}
.login-logo h1{font-size:1.4rem;color:var(--gold);font-weight:600;line-height:1.2}
.lfield{margin-bottom:15px}
.lfield label,.ffield label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.18em;color:var(--gold-dim);margin-bottom:6px;font-family:'Cinzel',serif}
.lfield select,.lfield input{width:100%;padding:11px 13px;background:rgba(12,11,16,.9);color:var(--txt);border:1px solid var(--edge);border-radius:var(--rad);font-size:1rem}
.lfield select:focus,.lfield input:focus{outline:none;border-color:var(--gold-dim)}
.btn-primary{width:100%;margin-top:6px;padding:13px;background:linear-gradient(180deg,var(--gold),var(--gold-dim));color:#1a1510;
  font-family:'Cinzel',serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;border-radius:var(--rad)}
.btn-primary:hover{filter:brightness(1.1)}
.pw-note{font-size:.84rem;color:var(--parch-dim);text-align:center;margin:-8px 0 16px;line-height:1.45}
.pw-warn{font-size:.8rem;color:var(--gold);text-align:center;margin:10px 0 0;font-style:italic}
.link-btn{display:block;margin:12px auto 0;font-size:.8rem;color:var(--txt-faint);text-decoration:underline}
.acct-row .pw{font-family:ui-monospace,Consolas,monospace;font-size:.85rem;color:var(--parch);background:var(--ink);border:1px solid var(--edge);border-radius:3px;padding:1px 6px;user-select:all}
.acct-row .pst{font-size:.68rem;font-style:italic;color:var(--txt-faint);margin-left:6px}
.acct-row .pst.must{color:var(--gold)}
.acct-meta{grid-column:1/-1;font-size:.8rem;color:var(--txt-dim);display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.login-err{color:var(--blood-bright);text-align:center;font-size:.9rem;margin-top:12px;min-height:1.1em}

/* shell */
#app{display:none;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);background:linear-gradient(180deg,rgba(20,18,27,.97),rgba(20,18,27,.88));
  border-bottom:1px solid var(--edge);padding:0 16px;display:flex;align-items:center;min-height:54px;gap:10px;flex-wrap:wrap}
.brand h1{font-size:.95rem;color:var(--gold);font-weight:600;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;padding:7px 0}
.whoami{font-size:.85rem;color:var(--txt-dim);white-space:nowrap;margin-right:4px}
.whoami b{color:var(--parch);font-weight:600}
.badge-dm{display:inline-block;margin-left:5px;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;background:var(--blood);color:#fff;padding:2px 5px;border-radius:3px;font-family:'Cinzel',serif;vertical-align:middle}
.topbtn{font-size:.64rem;text-transform:uppercase;letter-spacing:.09em;font-family:'Cinzel',serif;color:var(--txt-dim);border:1px solid var(--edge);padding:6px 11px;border-radius:var(--rad);white-space:nowrap}
.topbtn:hover{color:var(--parch);border-color:var(--gold-dim)}
.topbtn.on{color:#1a1510;background:var(--gold);border-color:var(--gold)}
.fy-note{margin-top:6px;padding:5px 8px;border-left:2px solid var(--gold-dim);background:rgba(201,162,75,.06);font-size:.8rem;color:var(--gold-dim);font-style:italic}
.fy-toggle{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.88rem;color:var(--parch-dim);cursor:pointer}
select.topbtn{background:var(--ink2);padding:5px 8px}
.preview-banner{display:none;background:rgba(201,162,75,.12);border-bottom:1px solid var(--gold-dim);color:var(--gold);padding:7px 16px;font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;align-items:center;gap:10px}
.preview-banner.on{display:flex}

.controls{position:sticky;top:54px;z-index:15;padding:10px 16px;background:linear-gradient(180deg,rgba(12,11,16,.95),rgba(12,11,16,.7));
  border-bottom:1px solid var(--edge);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;padding:8px 11px 8px 32px;background:var(--ink2);border:1px solid var(--edge);border-radius:var(--rad);color:var(--txt);font-size:.95rem}
.search input:focus{outline:none;border-color:var(--gold-dim)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.42}
.ctl{display:flex;align-items:center;gap:5px}
.ctl label{font-size:.6rem;text-transform:uppercase;letter-spacing:.11em;color:var(--gold-dim);font-family:'Cinzel',serif}
.ctl select{padding:6px 8px;background:var(--ink2);border:1px solid var(--edge);border-radius:var(--rad);color:var(--txt);font-size:.88rem;max-width:200px}
.chip{font-size:.68rem;padding:5px 10px;border:1px solid var(--edge);border-radius:20px;color:var(--txt-dim)}
.chip:hover{border-color:var(--gold-dim);color:var(--parch)}
.chip.on{background:var(--blood);border-color:var(--blood);color:#fff}
.count{font-size:.75rem;color:var(--txt-faint);font-style:italic;margin-left:auto}

.layout{display:flex;align-items:flex-start}
.main-col{flex:1;min-width:0}
.main{padding:18px 16px 80px}
.grp{margin-bottom:28px}
.grp-head{display:flex;align-items:center;gap:11px;margin:0 0 4px}
.grp-head h2{font-size:1.2rem;color:var(--gold);font-weight:600}
.grp-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--gold-dim),transparent)}
.grp-head .gcount{font-size:.7rem;color:var(--txt-faint);font-style:italic}
.subgrp{margin-top:13px}
.subgrp-head{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--parch-dim);margin:0 0 8px;padding-bottom:4px;border-bottom:1px dashed var(--edge)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--edge);border-radius:var(--rad);padding:11px 13px 12px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .18s,transform .12s,box-shadow .18s;text-align:left;width:100%}
.card:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-dim),0 8px 22px rgba(0,0,0,.4)}
.card.dead{filter:grayscale(.55) brightness(.82)}
.card.dead::after{content:"DECEASED";position:absolute;top:10px;right:-28px;transform:rotate(38deg);background:var(--blood);color:#fff;font-family:'Cinzel',serif;font-size:.48rem;letter-spacing:.14em;padding:2px 30px}
.card .nm{font-family:'Cinzel',serif;font-size:.96rem;color:var(--parch);font-weight:600;line-height:1.15;padding-right:14px}
.card .role{font-size:.82rem;color:var(--txt-dim);margin-top:2px;font-style:italic}
.yr{font-style:normal;font-family:'Cinzel',serif;font-size:.8em;letter-spacing:.06em;color:var(--gold);opacity:.85;cursor:help}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,transparent);transition:background .3s}
.card:hover .nm{color:var(--gold)}
.subgrp-head{display:flex;justify-content:space-between;align-items:baseline}
.subgrp-head .sc{font-family:'EB Garamond',serif;font-style:italic;letter-spacing:0;text-transform:none;color:var(--txt-faint);font-size:.78rem}
.rep-tick{position:absolute;top:1px;bottom:1px;width:1px;background:rgba(255,255,255,.07);z-index:1}
.rep-val{cursor:help}
.detail-row .v.unknown{color:var(--txt-faint);font-style:italic}
#tip{position:fixed;z-index:90;width:max-content;max-width:min(300px,calc(100vw - 12px));padding:7px 10px;background:var(--panel2);border:1px solid var(--gold-dim);border-radius:var(--rad);
  color:var(--parch);font-size:.82rem;line-height:1.4;box-shadow:var(--shadow);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;white-space:pre-line}
#tip.show{opacity:1;transform:translateY(0)}
.side-inner::-webkit-scrollbar,.modal-bg::-webkit-scrollbar{width:8px}
.side-inner::-webkit-scrollbar-thumb,.modal-bg::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:4px}
.card .pos{font-size:.7rem;color:var(--txt-faint);margin-top:2px}
.card .dmn{position:absolute;top:8px;right:10px;color:var(--gold-dim);font-size:.7rem}
.rep{margin-top:9px}
.rep-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.rep-lbl{font-size:.56rem;text-transform:uppercase;letter-spacing:.11em;color:var(--gold-dim);font-family:'Cinzel',serif}
.rep-val{font-family:'Cinzel',serif;font-size:.86rem;font-weight:600}
.rep-shell{position:relative}
.rep-track{position:relative;height:9px;background:var(--ink);border:1px solid var(--edge);border-radius:6px;overflow:hidden}
.rep-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--edge2);z-index:2}
.rep-fill{position:absolute;top:0;bottom:0;transition:left .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1)}
.rep-fill.p{background:linear-gradient(90deg,var(--pos),var(--pos-bright))}
.rep-fill.n{background:linear-gradient(90deg,var(--blood-bright),var(--blood))}
.rep-dot{position:absolute;top:4.5px;width:13px;height:13px;border-radius:50%;background:var(--parch);border:2px solid #1a1510;box-shadow:0 0 0 1px var(--gold),0 2px 5px rgba(0,0,0,.6);transform:translate(-50%,-50%);z-index:4;transition:left .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.rep-words{display:flex;justify-content:space-between;margin-top:3px}
.rep-words span{font-size:.53rem;color:var(--txt-faint)}
.empty{padding:60px 20px;text-align:center;color:var(--txt-faint);font-style:italic}

/* side panel */
aside.side{width:0;flex:0 0 auto;position:sticky;top:54px;height:calc(100vh - 54px);overflow:hidden;transition:width .28s cubic-bezier(.3,.8,.3,1);border-left:1px solid transparent;z-index:16}
aside.side.open{width:370px;border-left-color:var(--edge);background:linear-gradient(180deg,var(--ink2),var(--ink))}
.side-inner{width:370px;height:100%;overflow-y:auto;padding:22px 20px 60px;position:relative}
.side-close{position:absolute;top:10px;right:12px;width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:var(--txt-dim);background:var(--ink2);border:1px solid var(--edge2)}
.side-close:hover{color:var(--parch);border-color:var(--gold-dim)}
.side-name{font-family:'Cinzel',serif;font-size:1.35rem;color:var(--parch);font-weight:700;text-align:center;line-height:1.1;padding:0 26px}
.side-role{text-align:center;color:var(--gold-dim);font-style:italic;margin-top:3px;font-size:.92rem}
.side-sep{height:1px;background:linear-gradient(90deg,transparent,var(--edge2),transparent);margin:14px 0}
.detail-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dotted var(--edge);font-size:.92rem}
.detail-row .k{color:var(--gold-dim);font-family:'Cinzel',serif;font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;padding-top:3px;white-space:nowrap}
.detail-row .v{color:var(--parch);text-align:right}
.detail-row .v.classified{color:var(--blood-bright);font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.12em}
.pubnote{margin-top:14px;padding:10px 12px;border:1px solid var(--gold-dim);border-left:3px solid var(--gold);border-radius:var(--rad);background:rgba(201,162,75,.06)}
.pubnote-h{font-family:'Cinzel',serif;font-size:.6rem;text-transform:uppercase;letter-spacing:.13em;color:var(--gold);margin-bottom:4px}
.pubnote-body{color:var(--parch);font-size:.92rem;line-height:1.5;white-space:pre-wrap}
.dm-box{margin-top:14px;padding:11px;border:1px solid var(--blood);border-radius:var(--rad);background:rgba(158,43,43,.06)}
.dm-box h4{font-size:.64rem;text-transform:uppercase;letter-spacing:.13em;color:var(--blood-bright);margin-bottom:10px}
.pl-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dotted var(--edge)}
.pl-name{font-size:.88rem;color:var(--parch)}
.pl-ctrl{display:flex;align-items:center}
.pl-step{width:26px;height:28px;background:var(--ink);border:1px solid var(--edge2);color:var(--txt-dim);font-size:.95rem}
.pl-step:first-child{border-radius:4px 0 0 4px}.pl-step:last-child{border-radius:0 4px 4px 0}
.pl-step:hover{background:var(--gold);color:#1a1510;border-color:var(--gold)}
.pl-val{width:42px;height:28px;text-align:center;background:var(--ink2);border:1px solid var(--edge2);border-left:none;border-right:none;font-family:'Cinzel',serif;font-weight:600;font-size:.86rem;color:var(--parch)}
.pl-val:focus{outline:none;background:var(--panel2)}
.dm-actions{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.mini-btn{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;font-family:'Cinzel',serif;color:var(--txt-dim);border:1px solid var(--edge2);padding:5px 10px;border-radius:var(--rad);background:var(--ink)}
.mini-btn:hover{color:var(--parch);border-color:var(--gold-dim)}
.mini-btn.go{color:#1a1510;background:var(--gold);border-color:var(--gold)}
.mini-btn.danger{color:var(--blood-bright);border-color:var(--blood)}
.mini-btn.danger:hover{background:var(--blood);color:#fff}
.saved-flag{font-size:.62rem;color:var(--txt-faint);font-style:italic;margin-top:6px;min-height:1em;text-align:right}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(6,4,14,.72);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.modal-bg.open{display:flex}
.notes-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:'Cinzel',serif;font-size:.64rem;text-transform:uppercase;letter-spacing:.13em;color:var(--gold-dim);margin:16px 0 6px}
.note-bar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
.note-bar select{padding:3px 6px;background:var(--ink);border:1px solid var(--edge2);border-radius:var(--rad);color:var(--txt);font-size:.8rem}
.nt{min-width:28px;height:26px;padding:0 7px;border:1px solid var(--edge2);border-radius:var(--rad);background:var(--ink);color:var(--txt-dim);font-size:.78rem;font-family:'Cinzel',serif}
.nt:hover{color:var(--parch);border-color:var(--gold-dim)}
.nt.grow{margin-left:auto}
textarea.notes{width:100%;min-height:130px;resize:vertical;background:var(--ink);border:1px solid var(--edge);border-radius:var(--rad);color:var(--txt);padding:9px 11px;font-size:16px;line-height:1.6;tab-size:2}
textarea.notes:focus{outline:none;border-color:var(--gold-dim)}
textarea.notes[readonly]{opacity:.85;cursor:default}
textarea.notes.big{min-height:60vh}
.note-foot{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:.66rem;color:var(--txt-faint);font-style:italic;min-height:1.1em}
.note-foot .st.warn{color:var(--blood-bright);font-style:normal}
.note-foot .st.ok{color:var(--pos-bright)}
.modal.wide{width:min(900px,100%)}
.hist-item{border:1px solid var(--edge);border-radius:var(--rad);padding:8px 10px;margin-bottom:8px;background:var(--ink)}
.hist-item .hh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:var(--gold-dim);margin-bottom:5px}
.hist-item pre,.pn-body{white-space:pre-wrap;word-break:break-word;font-family:inherit;color:var(--parch);font-size:.9rem;line-height:1.5;max-height:220px;overflow:auto}
.pn{border:1px solid var(--edge);border-left:3px solid var(--gold-dim);border-radius:var(--rad);padding:9px 11px;margin-bottom:10px;background:var(--ink)}
.pn-h{display:flex;justify-content:space-between;gap:8px;font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.06em;color:var(--gold);margin-bottom:5px}
.pn-h span:last-child{font-family:'EB Garamond',serif;font-style:italic;letter-spacing:0;color:var(--txt-faint);font-size:.78rem}
.pn-body{max-height:none}
.card .mynote{position:absolute;bottom:8px;right:10px;color:var(--gold-dim);font-size:.72rem}
.modal{width:min(560px,100%);background:linear-gradient(180deg,var(--panel),var(--ink2));border:1px solid var(--edge2);border-radius:8px;box-shadow:var(--shadow);padding:22px 22px 18px}
.modal h3{color:var(--gold);font-size:1.05rem;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.ffield.full{grid-column:1/-1}
.ffield label{margin-bottom:4px;font-size:.6rem}
.ffield input,.ffield select,.ffield textarea,.inp{width:100%;padding:8px 10px;background:var(--ink);border:1px solid var(--edge);border-radius:var(--rad);color:var(--txt);font-size:.95rem}
.ffield textarea{min-height:90px;resize:vertical;line-height:1.45}
.ffield input:focus,.ffield textarea:focus,.inp:focus{outline:none;border-color:var(--gold-dim)}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--parch-dim)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;align-items:center}
.modal-foot .err{margin-right:auto;color:var(--blood-bright);font-size:.85rem}
.acct-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dotted var(--edge)}
.acct-row .an{color:var(--parch);font-size:.95rem}
.acct-row input{width:130px;padding:5px 8px;background:var(--ink);border:1px solid var(--edge);border-radius:var(--rad);color:var(--txt);font-size:.85rem}
.mod-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.mod-row select,.mod-row input{padding:7px 9px;background:var(--ink);border:1px solid var(--edge);border-radius:var(--rad);color:var(--txt);font-size:.95rem}
.mod-row input{width:70px;text-align:center;font-family:'Cinzel',serif}
.mod-net{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin:6px 0 12px;font-size:.88rem}
.mod-net b{font-family:'Cinzel',serif}
.mod-log{max-height:220px;overflow:auto;border-top:1px dotted var(--edge);padding-top:6px;font-size:.84rem;color:var(--txt-dim)}
.mod-log div{padding:2px 0}
.acct-new{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center;margin-top:14px}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--panel2);border:1px solid var(--gold-dim);color:var(--parch);padding:9px 16px;border-radius:var(--rad);font-size:.9rem;z-index:80;transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spinner{width:22px;height:22px;border:2px solid var(--edge2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:16px auto}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:760px){
  aside.side{position:fixed;top:0;right:0;height:100vh;z-index:40}
  aside.side.open{width:100%}
  .side-inner{width:100%}
  .controls{top:0;position:relative}
  .cards{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .acct-row{grid-template-columns:1fr;}
  .acct-new{grid-template-columns:1fr}
  .count{margin-left:0;width:100%}
}
</style>
</head>
<body>

<div id="loginScreen">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-logo"><h1>Honor Tracker</h1></div>
    <div class="lfield"><label for="lChar">Name</label><select id="lChar"><option value="">Loading…</option></select></div>
    <div class="lfield"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password"></div>
    <button class="btn-primary" type="submit" id="lBtn">Enter</button>
    <div class="login-err" id="lErr"></div>
  </form>
  <form class="login-card" id="pwForm" style="display:none" autocomplete="off">
    <div class="login-logo"><h1>Choose a new password</h1></div>
    <p class="pw-note" id="pwIntro">First login: replace your start code with a password of your own.</p>
    <div class="lfield"><label for="pwNew">New password</label><input id="pwNew" type="password" autocomplete="new-password" minlength="4" maxlength="64"></div>
    <div class="lfield"><label for="pwNew2">Type it again</label><input id="pwNew2" type="password" autocomplete="new-password" maxlength="64"></div>
    <button class="btn-primary" type="submit" id="pwBtn">Save password</button>
    <p class="pw-warn">The DM can see this password, so don't reuse one from another site.</p>
    <div class="login-err" id="pwErr"></div>
    <button class="link-btn" type="button" id="pwLogout">Log out instead</button>
  </form>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand"><h1>Honor Tracker</h1></div>
    <div class="topbar-right">
      <span class="whoami" id="whoami"></span>
      <span id="dmTools" style="display:none;gap:6px;flex-wrap:wrap;align-items:center">
        <select class="topbtn" id="previewSel" aria-label="Preview as player" data-tip="See the site exactly as this player sees it (read-only)"><option value="">Preview as…</option></select>
        <button class="topbtn" id="btnFY" data-tip="Show or hide every first year's signets for players. A first year's own Reveal checkbox still works while this is Hidden.">1st-Yr Signets: Hidden</button>
        <button class="topbtn" id="btnMod" data-tip="Raise or lower one player's standing with every living Basgiath NPC (cadets and staff) at once">Basgiath Modifier</button>
        <button class="topbtn" id="btnAddNpc" data-tip="Add a new NPC">+ NPC</button>
        <button class="topbtn" id="btnAccounts" data-tip="Create accounts, see and reset passwords, delete accounts">Accounts</button>
        <button class="topbtn" id="btnExport" data-tip="Download a JSON backup: NPCs, accounts, standings, notes, note history and the deletion archive">Export</button>
      </span>
      <button class="topbtn" id="btnPassword" data-tip="Change your password">Password</button>
      <button class="topbtn" id="btnLogout">Log out</button>
    </div>
  </header>
  <div class="preview-banner" id="previewBanner"><span id="previewText"></span><button class="mini-btn" id="btnExitPreview">Exit preview</button></div>
  <div class="layout">
    <div class="main-col">
      <div class="controls">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="fQ" type="search" placeholder="Search name, role, squad, signet…" aria-label="Search">
    </div>
    <div class="ctl"><label for="fGroup">Group</label><select id="fGroup"></select></div>
    <div class="ctl"><label for="fSort">Sort</label><select id="fSort">
      <option value="default">Roster</option><option value="name">Name</option>
      <option value="rep_hi">Standing ↓</option><option value="rep_lo">Standing ↑</option></select></div>
    <button class="chip" id="fDead" data-tip="Hide NPCs marked deceased">Hide deceased</button>
    <span class="count" id="count"></span>
  </div>
      <main class="main" id="main"><div class="spinner"></div></main>
    </div>
    <aside class="side" id="side" aria-label="NPC details"><div class="side-inner" id="sideInner"></div></aside>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<div id="tip" role="tooltip"></div>

<script>
const API="https://adqnhmmgrrptiljuvnwv.supabase.co/functions/v1/rep-api-g2";
const PUB="sb_publishable_NaXgpmsqeHWBQale9Y1pDg_eQkDudOO";
const TOKEN_KEY="g2_honor_token";
let TOKEN=null,ME=null,PREVIEW=null,selectedId=null,pollTimer=null;
const STATE={npcs:[],scores:{},settings:{},notes:{}};
const F={q:"",group:"",sort:"default",hideDead:false};
const $=id=>document.getElementById(id);

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,ms=2400){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),ms);}

async function api(action,body={}){
  const h={"Content-Type":"application/json","apikey":PUB,"Authorization":"Bearer "+PUB};
  if(TOKEN)h["x-session-token"]=TOKEN;
  const res=await fetch(API,{method:"POST",headers:h,body:JSON.stringify({action,...body})});
  let d={};try{d=await res.json();}catch(e){}
  if(res.status===401&&action!=="login"){logoutLocal();throw new Error("Session expired — please log in again");}
  if(res.status===403&&d.must_change_password){if(ME)ME.must_change_password=true;showForcedPwChange();throw new Error("Password change required");}
  if(!res.ok)throw new Error(d.error||("HTTP "+res.status));
  return d;
}

/* ---------- login ---------- */
async function loadCharacters(){
  try{
    const r=await api("list_characters");
    const sel=$("lChar");
    const list=(r.characters||[]).slice().sort((a,b)=>(b.is_dm-a.is_dm)||a.character_name.localeCompare(b.character_name));
    sel.innerHTML='<option value="">Choose…</option>'+list.map(c=>`<option value="${esc(c.character_name)}">${esc(c.character_name)}</option>`).join("");
    const last=lsGet("g2_last_char");if(last)sel.value=last;
  }catch(e){$("lErr").textContent="Can't reach the server: "+e.message;}
}
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=$("lChar").value,pw=$("lPass").value;
  if(!name){$("lErr").textContent="Choose your name";return;}
  $("lBtn").disabled=true;$("lErr").textContent="";
  try{
    const r=await api("login",{character_name:name,password:pw});
    TOKEN=r.token;lsSet(TOKEN_KEY,TOKEN);lsSet("g2_last_char",name);
    ME={character_name:r.character_name,is_dm:r.is_dm,must_change_password:!!r.must_change_password};
    $("lPass").value="";
    if(ME.must_change_password)showForcedPwChange();else enterApp();
  }catch(err){$("lErr").textContent=err.message;}
  $("lBtn").disabled=false;
});
function logoutLocal(){
  TOKEN=null;ME=null;PREVIEW=null;lsSet(TOKEN_KEY,null);stopPolling();closeSide();
  // Wipe the previous user's data and view so the next person on this browser never sees it.
  stateSeq++;STATE.npcs=[];STATE.scores={};STATE.notes={};STATE.settings={};
  $("main").innerHTML='<div class="spinner"></div>';$("sideInner").innerHTML="";
  F.q="";$("fQ").value="";$("previewBanner").classList.remove("on");$("previewSel").value="";
  $("app").style.display="none";$("loginScreen").style.display="flex";
  $("pwForm").style.display="none";$("loginForm").style.display="";
  loadCharacters();  // the name list may never have loaded if this session started from a saved login
}
$("btnLogout").onclick=async()=>{try{await flushAllNotes();}catch(e){}try{await api("logout");}catch(e){}logoutLocal();};

async function enterApp(){
  $("loginScreen").style.display="none";$("app").style.display="block";
  $("whoami").innerHTML=`<b>${esc(ME.character_name)}</b>${ME.is_dm?'<span class="badge-dm">DM</span>':''}`;
  $("dmTools").style.display=ME.is_dm?"inline-flex":"none";
  if(ME.is_dm)loadPreviewList();
  await refreshState();
}
async function boot(){
  TOKEN=lsGet(TOKEN_KEY);
  if(TOKEN){
    try{const r=await api("me");ME=r;if(ME.must_change_password)showForcedPwChange();else enterApp();return;}
    catch(e){
      // A 401 already logged us out inside api(). Anything else is a network problem: keep the saved login.
      if(TOKEN){$("lErr").textContent="Can't reach the server right now. Check your connection and reload.";TOKEN=null;}
    }
  }
  $("loginScreen").style.display="flex";loadCharacters();
}

/* ---------- state ---------- */
const viewingAsDM=()=>ME&&ME.is_dm&&!PREVIEW;
let stateSeq=0;
async function refreshState(){
  // Only the newest request may update STATE. Without this, switching Preview on/off quickly could let a
  // late (player-masked) preview response overwrite the DM's real data, and an edit would then save "Unknown".
  const seq=++stateSeq;
  try{
    const r=PREVIEW?await api("preview_as_player",{target_account_id:PREVIEW.id}):await api("get_state");
    if(seq!==stateSeq)return;
    STATE.npcs=r.npcs||[];STATE.scores=r.scores||{};STATE.notes=r.notes||{};if(r.settings)STATE.settings=r.settings;syncFYButton();
    if(!PREVIEW)mergeLocalDrafts();
    buildGroupFilter();render();
    if(selectedId)openSide(selectedId);
    if(!ME.is_dm)startPolling();
  }catch(e){if(seq===stateSeq)$("main").innerHTML=`<div class="empty">${esc(e.message)}</div>`;}
}
async function pollScores(){
  if(!TOKEN||ME.is_dm)return;
  try{
    const r=await api("poll_scores");const s=r.scores||{};
    const changed=Object.keys({...s,...STATE.scores}).some(k=>s[k]!==STATE.scores[k]);
    if(changed){STATE.scores=s;render();
      // Don't rebuild the side panel while the player is typing a note (it would move their cursor).
      const typing=document.activeElement&&document.activeElement.classList.contains("notes");
      if(selectedId&&!typing)openSide(selectedId);}
  }catch(e){}
}
function startPolling(){stopPolling();pollTimer=setInterval(pollScores,8000);}
function stopPolling(){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}

/* ---------- helpers ---------- */
const repOf=id=>STATE.scores[id]??0;
const SIGNET_GROUPS=["Basgiath War College","Kingdom of Navarre"];
const usesSignets=g=>SIGNET_GROUPS.includes(g||"");
// First years haven't been threshed: players get "Unknown" (masked by the server) unless the
// global toggle is on or this NPC's own toggle is on.
const isFirstYear=n=>usesSignets(n.grp)&&String(n.year??"").trim()==="1";
const hiddenFromPlayers=n=>isFirstYear(n)&&!STATE.settings.reveal_first_year_signets&&!n.signet_revealed;
function repColor(v){return v>0?"var(--pos-bright)":v<0?"var(--blood-bright)":"var(--neutral)";}
const STANDING_TIP="Devoted: +15 and up\nTrusted: +8 to +14\nFriendly: +3 to +7\nNeutral: −2 to +2\nWary: −7 to −3\nHostile: −14 to −8\nNemesis: −15 and below";
// Role line with the cadet year appended, e.g. "Cadet [1]". NPCs without a year (other groups,
// some leaders) show the role alone; NPCs without a role show nothing.
function roleHTML(n,cls){
  const y=String(n.year??"").trim();
  if(!n.role&&!y)return"";
  const tag=y?`<span class="yr" data-tip="Year ${esc(y)}">[${esc(y)}]</span>`:"";
  return `<div class="${cls}">${esc(n.role||"")}${n.role&&tag?" ":""}${tag}</div>`;
}
function repWord(v){if(v>=15)return"Devoted";if(v>=8)return"Trusted";if(v>=3)return"Friendly";if(v>-3)return"Neutral";if(v>-8)return"Wary";if(v>-15)return"Hostile";return"Nemesis";}
function repBar(v){
  const pct=Math.abs(v)/20*50,cls=v>=0?"p":"n",left=v>=0?50:50-pct,dot=(v+20)/40*100;
  const ticks=[-15,-8,-3,3,8,15].map(t=>`<div class="rep-tick" style="left:${(t+20)/40*100}%"></div>`).join("");
  return `<div class="rep-shell"><div class="rep-track">${ticks}<div class="rep-mid"></div><div class="rep-fill ${cls}" style="left:${left}%;width:${pct}%"></div></div><div class="rep-dot" style="left:${dot}%"></div></div>`;
}
function repBlock(v,extra=""){
  return `<div class="rep"${extra}><div class="rep-top"><span class="rep-lbl">Standing</span><span class="rep-val" style="color:${repColor(v)}" data-tip="${STANDING_TIP}">${v>0?'+':''}${v} · ${repWord(v)}</span></div>${repBar(v)}<div class="rep-words"><span>−20</span><span>0</span><span>+20</span></div></div>`;
}
function ordinal(n){n=parseInt(n);if(isNaN(n))return null;const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function posText(n){
  if(!n.wing)return n.subgroup||"";
  const bits=[];
  if(n.squad)bits.push(n.squad+" Squad");
  if(n.section==="Leadership")bits.push("Leadership");else if(n.section)bits.push(n.section+" Section");
  bits.push(ordinal(n.wing)+" Wing");
  return bits.join(" · ");
}
function buildGroupFilter(){
  const groups=[...new Set(STATE.npcs.map(n=>n.grp||"Unaffiliated"))];
  const sel=$("fGroup"),cur=sel.value;
  sel.innerHTML='<option value="">All</option>'+groups.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join("");
  if(groups.includes(cur))sel.value=cur;
}
function filtered(){
  let list=STATE.npcs.slice();
  if(F.group)list=list.filter(n=>(n.grp||"Unaffiliated")===F.group);
  if(F.hideDead)list=list.filter(n=>!n.deceased);
  if(F.q){const q=F.q.toLowerCase();list=list.filter(n=>[n.name,n.role,n.grp,n.subgroup,n.signet,n.second_signet,n.power,n.year&&("year "+n.year),!viewingAsDM()&&STATE.notes[n.id]&&STATE.notes[n.id].body].some(v=>v&&String(v).toLowerCase().includes(q)));}
  if(F.sort==="name")list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(F.sort==="rep_hi")list.sort((a,b)=>repOf(b.id)-repOf(a.id)||a.sort_order-b.sort_order);
  else if(F.sort==="rep_lo")list.sort((a,b)=>repOf(a.id)-repOf(b.id)||a.sort_order-b.sort_order);
  else list.sort((a,b)=>(a.sort_order??1e9)-(b.sort_order??1e9));
  return list;
}

/* ---------- render ---------- */
function cardHTML(n,showPos){
  const v=repOf(n.id),pos=showPos?posText(n):"";
  const accent=v>0?"var(--pos)":v<0?"var(--blood-bright)":"transparent";
  return `<div class="card ${n.deceased?'dead':''} ${n.id===selectedId?'sel':''}" data-id="${n.id}" role="button" tabindex="0" style="--accent:${accent}">
    ${viewingAsDM()&&n.public_note?'<span class="dmn" data-tip="Has a note from the DM">✎</span>':''}
    ${!viewingAsDM()&&STATE.notes[n.id]&&STATE.notes[n.id].body&&STATE.notes[n.id].body.trim()?`<span class="mynote" data-tip="${PREVIEW?"This player has notes on this NPC":"You have notes on this NPC"}">✎ notes</span>`:''}
    <div class="nm">${esc(n.name)}</div>${roleHTML(n,"role")}
    ${pos?`<div class="pos">${esc(pos)}</div>`:''}
    ${repBlock(v)}</div>`;
}
function render(){
  const list=filtered(),main=$("main");
  $("count").textContent=`${list.length} of ${STATE.npcs.length} NPCs`;
  if(!list.length){main.innerHTML=`<div class="empty">No NPCs match your search.</div>`;return;}
  if(F.sort!=="default"){
    const label={name:"Name (A–Z)",rep_hi:"Standing (high → low)",rep_lo:"Standing (low → high)"}[F.sort];
    main.innerHTML=`<section class="grp"><div class="grp-head"><h2>${esc(label)}</h2><div class="rule"></div><span class="gcount">${list.length}</span></div><div class="cards">${list.map(n=>cardHTML(n,true)).join("")}</div></section>`;
  }else{
    const groups=[],gmap={};
    for(const n of list){
      const g=n.grp||"Unaffiliated";
      if(!gmap[g]){gmap[g]={name:g,subs:{},order:[]};groups.push(gmap[g]);}
      const sg=n.subgroup||"";
      if(!gmap[g].subs[sg]){gmap[g].subs[sg]=[];gmap[g].order.push(sg);}
      gmap[g].subs[sg].push(n);
    }
    main.innerHTML=groups.map(g=>{
      const total=g.order.reduce((s,k)=>s+g.subs[k].length,0);
      return `<section class="grp"><div class="grp-head"><h2>${esc(g.name)}</h2><div class="rule"></div><span class="gcount">${total}</span></div>`+
        g.order.map(sg=>`<div class="subgrp">${sg?`<div class="subgrp-head"><span>${esc(sg)}</span><span class="sc">${g.subs[sg].length}</span></div>`:''}<div class="cards">${g.subs[sg].map(n=>cardHTML(n,false)).join("")}</div></div>`).join("")+`</section>`;
    }).join("");
  }
  main.querySelectorAll(".card").forEach(c=>{c.addEventListener("click",()=>openSide(c.dataset.id));c.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openSide(c.dataset.id);}});});
}
$("fQ").addEventListener("input",e=>{F.q=e.target.value.trim();render();});
$("fGroup").addEventListener("change",e=>{F.group=e.target.value;render();});
$("fSort").addEventListener("change",e=>{F.sort=e.target.value;render();});
$("fDead").addEventListener("click",e=>{F.hideDead=!F.hideDead;e.target.classList.toggle("on",F.hideDead);render();});

/* ---------- side panel ---------- */
function openSide(id){
  const n=STATE.npcs.find(x=>x.id===id);if(!n){closeSide();return;}
  selectedId=id;
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("sel",c.dataset.id===id));
  const v=repOf(id),rows=[];
  const pos=posText(n);if(pos&&n.wing)rows.push(["Position",pos]);
  if(n.year)rows.push(["Year",n.year]);
  if(usesSignets(n.grp)){
    if(n.signet)rows.push(["Signet",n.signet]);
    if(n.second_signet)rows.push(["Second Signet",n.second_signet]);
  }else rows.push(["Power",n.power||"Unknown"]);
  const fyNote=viewingAsDM()&&hiddenFromPlayers(n)?'<div class="fy-note">First year: players see both signets as Unknown.</div>':"";
  rows.push(["Status",n.deceased?"Deceased":"Active"]);
  let html=`<button class="side-close" id="sideClose" aria-label="Close">×</button>
    <div class="side-name">${esc(n.name)}</div>${roleHTML(n,"side-role")}
    <div style="max-width:270px;margin:14px auto 0">${repBlock(v)}</div>
    <div class="side-sep"></div>
    ${rows.map(r=>`<div class="detail-row"><span class="k">${esc(r[0])}</span><span class="v ${r[1]==="CLASSIFIED"?'classified':r[1]==="Unknown"?'unknown':''}" ${r[1]==="CLASSIFIED"?'data-tip="This signet is classified"':r[1]==="Unknown"?'data-tip="Not known"':r[0]==="Year"?`data-tip="Year ${esc(r[1])} cadet"`:''}>${esc(r[1])}</span></div>`).join("")}${fyNote}
    ${n.public_note?`<div class="pubnote"><div class="pubnote-h">Note from the DM</div><div class="pubnote-body">${esc(n.public_note)}</div></div>`:''}`;
  if(viewingAsDM())html+=dmBoxHTML(n);
  else html+=`<div class="notes-h"><span>${PREVIEW?esc(PREVIEW.name)+"'s Notes":"Your Private Notes"}</span></div>${noteEditorHTML("s",!!PREVIEW,false)}`;
  $("sideInner").innerHTML=html;
  $("side").classList.add("open");
  $("sideClose").onclick=closeSide;
  if(viewingAsDM())wireDmBox(n);else wireNoteEditor(n,"s",!!PREVIEW);
}
function closeSide(){$("side").classList.remove("open");selectedId=null;document.querySelectorAll(".card.sel").forEach(c=>c.classList.remove("sel"));}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("modalBg").classList.contains("open"))closeModal();else closeSide();}});

/* ---------- DM: per-player standing ---------- */
function dmBoxHTML(n){
  return `<div class="dm-box"><h4>DM · Per-Player Standing</h4>
    <div id="dmPlayers"><div class="spinner"></div></div>
    <div class="saved-flag" id="dmSaved"></div>
    <div class="dm-actions">
      <button class="mini-btn" id="dmEdit" data-tip="Edit details and the note players see">Edit NPC / Note</button>
      <button class="mini-btn" id="dmDead">${n.deceased?"Mark Alive":"Mark Deceased"}</button>
      <button class="mini-btn" id="dmPlayerNotes" data-tip="Read every player's private notes on this NPC">Player Notes</button>
    </div>
    ${isFirstYear(n)?`<label class="fy-toggle"><input type="checkbox" id="dmReveal" ${n.signet_revealed?"checked":""}> Reveal this first year's signets${STATE.settings.reveal_first_year_signets?" (all first years are revealed right now)":""}</label>`:""}
    <div class="dm-actions" style="margin-top:8px">
      <button class="mini-btn danger" id="dmDelete" data-tip="Delete this NPC. Its details, standings and player notes are kept in the deletion archive.">Delete</button>
    </div></div>`;
}
async function wireDmBox(n){
  $("dmPlayerNotes").onclick=()=>openPlayerNotes(n);
  if($("dmReveal"))$("dmReveal").onchange=async e=>{
    const v=e.target.checked;
    try{await api("upsert_npc",{npc:{id:n.id,signet_revealed:v}});n.signet_revealed=v;openSide(n.id);toast(v?"Signets revealed for "+n.name:"Signets hidden for "+n.name);}
    catch(err){e.target.checked=!v;toast(err.message);}
  };
  $("dmEdit").onclick=()=>openEditor(n);
  $("dmDead").onclick=async()=>{
    try{await api("upsert_npc",{npc:{id:n.id,deceased:!n.deceased}});n.deceased=!n.deceased;n.status=n.deceased?"Deceased":"Active";render();openSide(n.id);}
    catch(e){toast(e.message);}
  };
  $("dmDelete").onclick=()=>confirmModal(`Delete ${n.name}?`,"This removes the NPC from the site. Its details, every player's standing with it and every player's notes on it are kept in the deletion archive (included in Export).","Delete",async()=>{
    await api("delete_npc",{npc_id:n.id});STATE.npcs=STATE.npcs.filter(x=>x.id!==n.id);closeSide();buildGroupFilter();render();toast("Deleted");
  });
  const box=$("dmPlayers");
  let r;try{r=await api("dm_scores_for_npc",{npc_id:n.id});}catch(e){box.textContent=e.message;return;}

  if(r.deceased){box.innerHTML='<div class="fy-note" style="margin:0">Deceased: every player\'s standing is fixed at 0. Their earlier standings are kept and come back if you mark them alive.</div>';return;}
  box.innerHTML=r.players.map(p=>{const v=r.scores[p.id]??0;return `<div class="pl-row" data-pid="${p.id}">
    <span class="pl-name">${esc(p.character_name)}</span>
    <span class="pl-ctrl"><button class="pl-step" data-d="-1" aria-label="Decrease" data-tip="−1">−</button><input class="pl-val" value="${v}" inputmode="numeric" aria-label="Standing for ${esc(p.character_name)}" data-tip="Type a value from −20 to +20, then press Enter"><button class="pl-step" data-d="1" aria-label="Increase" data-tip="+1">+</button></span></div>`;}).join("");
  box.querySelectorAll(".pl-row").forEach(row=>{
    const inp=row.querySelector(".pl-val"),pid=row.dataset.pid;let t=null;
    const save=v=>{
      v=Math.max(-20,Math.min(20,parseInt(v)||0));inp.value=v;
      clearTimeout(t);$("dmSaved").textContent="saving…";
      t=setTimeout(async()=>{try{await api("set_score",{target_account_id:pid,npc_id:n.id,value:v});$("dmSaved").textContent="saved ✓";}catch(e){$("dmSaved").textContent="save failed: "+e.message;}},450);

    row.querySelectorAll(".pl-step").forEach(b=>b.onclick=()=>save((parseInt(inp.value)||0)+parseInt(b.dataset.d)));
    inp.addEventListener("change",()=>save(inp.value));
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")inp.blur();});
  });
}

/* ================= player notes =================
   Redundancy layers:
   1. Every edit is written to this browser's storage immediately (draft), before any network call.
   2. Drafts sync to the server ~1s after typing stops, on blur, when the tab is hidden and on logout.
   3. A failed save keeps the draft and retries every 15s and on the next visit, until the server confirms.
   4. The server archives the previous version before every overwrite (last 30 kept; see History).
   5. DM Export includes all notes and their history. */
const NOTE_FONTS={serif:"'EB Garamond',Georgia,serif",sans:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif",mono:"ui-monospace,Consolas,'Courier New',monospace"};
const NOTE_LH=[1.35,1.6,1.9];
const DEFAULT_STYLE={font:"serif",size:16,lh:1.6};
const NOTE_MAX=50000;
const noteTimers={},noteInFlight={},noteAgain={};
let noteRetryTimer=null;
const draftPrefix=()=>"g2_note_draft:"+(ME?ME.character_name:"?")+":";
function getDraft(id){try{return JSON.parse(lsGet(draftPrefix()+id)||"null");}catch(e){return null;}}
function setDraft(id,d){lsSet(draftPrefix()+id,d?JSON.stringify(d):null);}
function lastStyle(){try{return {...DEFAULT_STYLE,...JSON.parse(lsGet("g2_note_style")||"{}")};}catch(e){return {...DEFAULT_STYLE};}}
function noteOf(id){const n=STATE.notes[id];return {body:n?.body||"",style:{...DEFAULT_STYLE,...(n?.style||lastStyle())},updated_at:n?.updated_at||null};}
function pendingIds(){
  const out=[];try{const pre=draftPrefix();for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(pre))out.push(k.slice(pre.length));}}catch(e){}
  return out;
}
function fmtTime(iso){if(!iso)return"";const d=new Date(iso);return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}
function applyNoteStyle(ta,st){ta.style.fontFamily=NOTE_FONTS[st.font]||NOTE_FONTS.serif;ta.style.fontSize=st.size+"px";ta.style.lineHeight=st.lh;}
function wordCount(t){const m=t.trim().match(/\S+/g);return m?m.length:0;}

/* status shown under every open editor for this NPC */
function setNoteStatus(id,kind,extra){
  document.querySelectorAll(`.note-st[data-id="${id}"]`).forEach(el=>{
    el.classList.remove("warn","ok");
    if(kind==="saving")el.textContent="Saving…";
    else if(kind==="saved"){el.textContent="Saved "+fmtTime(extra)+" ✓";el.classList.add("ok");}
    else if(kind==="local"){el.textContent="Not synced yet — kept on this device, retrying…";el.classList.add("warn");}
    else if(kind==="idle")el.textContent=extra?("Last saved "+fmtTime(extra)):"";
  });
}
function queueNoteSave(id,body,style){
  setDraft(id,{body,style,ts:Date.now()});
  STATE.notes[id]={...(STATE.notes[id]||{}),body,style};
  setNoteStatus(id,"saving");
  clearTimeout(noteTimers[id]);noteTimers[id]=setTimeout(()=>flushNote(id),1000);
}
async function flushNote(id){
  clearTimeout(noteTimers[id]);noteTimers[id]=null;
  const d=getDraft(id);if(!d)return true;
  if(noteInFlight[id]){noteAgain[id]=true;return false;}
  noteInFlight[id]=true;let ok=false;
  try{
    const r=await api("set_note",{npc_id:id,body:d.body,style:d.style});
    const cur=getDraft(id);
    if(cur&&cur.ts===d.ts)setDraft(id,null);           // only clear if nothing newer was typed meanwhile
    STATE.notes[id]={body:d.body,style:d.style,updated_at:r.updated_at};
    if(!getDraft(id))setNoteStatus(id,"saved",r.updated_at);
    ok=true;
  }catch(e){
    setNoteStatus(id,"local");scheduleNoteRetry();
    if(/too long/i.test(e.message))toast(e.message);
  }finally{
    noteInFlight[id]=false;
    if(noteAgain[id]){noteAgain[id]=false;flushNote(id);}
  }
  refreshNoteMarker(id);
  return ok;
}
function scheduleNoteRetry(){if(noteRetryTimer)return;noteRetryTimer=setTimeout(async()=>{noteRetryTimer=null;await flushAllNotes();},15000);}
async function flushAllNotes(){
  if(!ME||PREVIEW)return;
  const ids=pendingIds();let allOk=true;
  for(const id of ids){if(!STATE.npcs.some(n=>n.id===id)){continue;}if(!(await flushNote(id)))allOk=false;}
  return allOk;
}
/* After loading state: any unsynced local draft wins (the server keeps the old version in History). */
function mergeLocalDrafts(){
  if(!ME)return;
  const ids=pendingIds();
  ids.forEach(id=>{const d=getDraft(id);if(d&&STATE.npcs.some(n=>n.id===id))STATE.notes[id]={...(STATE.notes[id]||{}),body:d.body,style:d.style};});
  if(ids.length)flushAllNotes();
}
function refreshNoteMarker(id){
  const card=document.querySelector(`.card[data-id="${id}"]`);if(!card)return;
  const has=!!(STATE.notes[id]&&STATE.notes[id].body&&STATE.notes[id].body.trim());
  let m=card.querySelector(".mynote");
  if(has&&!m){card.insertAdjacentHTML("beforeend",'<span class="mynote" data-tip="You have notes on this NPC">✎ notes</span>');}
  else if(!has&&m)m.remove();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushAllNotes();});
window.addEventListener("pagehide",()=>{
  // Best effort on close: keepalive requests survive the page unloading. Drafts stay in storage either way.
  if(!TOKEN||PREVIEW)return;
  pendingIds().forEach(id=>{const d=getDraft(id);if(!d)return;
    try{fetch(API,{method:"POST",keepalive:true,headers:{"Content-Type":"application/json","apikey":PUB,"Authorization":"Bearer "+PUB,"x-session-token":TOKEN},body:JSON.stringify({action:"set_note",npc_id:id,body:d.body,style:d.style})});}catch(e){}
  });
});
// Warn only while a save is actually mid-flight or about to fire; unsynced drafts are already kept on this device.
window.addEventListener("beforeunload",e=>{if(Object.values(noteInFlight).some(Boolean)||Object.values(noteTimers).some(Boolean)){e.preventDefault();e.returnValue="";}});

/* editor markup (p = prefix so the side panel and the expanded editor can coexist) */
function noteEditorHTML(p,readOnly,big){
  const tools=readOnly?`<div class="note-bar"><button class="nt grow" id="${p}Expand" data-tip="Open in a large window">⤢ Expand</button></div>`:
  `<div class="note-bar">
    <select id="${p}Font" aria-label="Font" data-tip="Font"><option value="serif">Serif</option><option value="sans">Sans</option><option value="mono">Mono</option></select>
    <button class="nt" id="${p}Smaller" data-tip="Smaller text">A−</button>
    <button class="nt" id="${p}Bigger" data-tip="Larger text">A+</button>
    <button class="nt" id="${p}Spacing" data-tip="Line spacing">↕</button>
    <button class="nt" id="${p}Stamp" data-tip="Insert today's date and time">🕒</button>
    <button class="nt" id="${p}History" data-tip="Earlier saved versions (restore anything)">⟲</button>
    ${big?`<button class="nt" id="${p}Download" data-tip="Download this note as a .txt file">⤓</button>`:`<button class="nt grow" id="${p}Expand" data-tip="Open in a large editor">⤢</button>`}
  </div>`;
  return `${tools}<textarea class="notes ${big?"big":""}" id="${p}Area" maxlength="${NOTE_MAX}" ${readOnly?"readonly":""} placeholder="${readOnly?"No notes.":"Only you (and the DM) can see these…"}" spellcheck="true"></textarea>
    <div class="note-foot"><span class="st note-st" id="${p}St"></span><span id="${p}Count"></span></div>`;
}
function wireNoteEditor(n,p,readOnly){
  const id=n.id,ta=$(p+"Area");if(!ta)return;
  const cur=noteOf(id);let style={...cur.style};
  ta.value=cur.body;applyNoteStyle(ta,style);
  $(p+"St").dataset.id=id;
  const count=()=>{$(p+"Count").textContent=`${wordCount(ta.value)} words · ${ta.value.length.toLocaleString()} chars`;};
  count();
  if(getDraft(id)&&!readOnly)setNoteStatus(id,"local");else setNoteStatus(id,"idle",cur.updated_at);
  if($(p+"Expand"))$(p+"Expand").onclick=()=>openNoteModal(n,readOnly);
  if(readOnly)return;
  const changed=()=>{count();queueNoteSave(id,ta.value,{...style});};
  const restyle=()=>{applyNoteStyle(ta,style);lsSet("g2_note_style",JSON.stringify(style));if(ta.value||STATE.notes[id])changed();};
  $(p+"Font").value=style.font;
  $(p+"Font").onchange=e=>{style.font=e.target.value;restyle();};
  $(p+"Smaller").onclick=()=>{style.size=Math.max(12,style.size-1);restyle();};
  $(p+"Bigger").onclick=()=>{style.size=Math.min(28,style.size+1);restyle();};
  $(p+"Spacing").onclick=()=>{const i=NOTE_LH.indexOf(style.lh);style.lh=NOTE_LH[(i+1)%NOTE_LH.length];restyle();};
  $(p+"Stamp").onclick=()=>{
    const stamp="["+new Date().toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})+"] ";
    const a=ta.selectionStart??ta.value.length,b=ta.selectionEnd??a;
    const pre=ta.value.slice(0,a),lead=pre&&!pre.endsWith("\n")?"\n":"";
    ta.value=pre+lead+stamp+ta.value.slice(b);const pos=(pre+lead+stamp).length;ta.focus();ta.setSelectionRange(pos,pos);changed();
  };
  $(p+"History").onclick=()=>openNoteHistory(n);
  if($(p+"Download"))$(p+"Download").onclick=()=>{
    const blob=new Blob([n.name+"\n"+"=".repeat(n.name.length)+"\n\n"+ta.value],{type:"text/plain"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=("notes-"+n.name).replace(/[^\w\- ]+/g,"").replace(/\s+/g,"-")+".txt";
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  ta.addEventListener("input",changed);
  ta.addEventListener("blur",()=>flushNote(id));
  ta.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();flushNote(id);}
  });
}
function openNoteModal(n,readOnly){
  flushNote(n.id);
  openModal(`<h3>${esc(n.name)} · ${readOnly&&PREVIEW?esc(PREVIEW.name)+"'s notes":"Notes"}</h3>${noteEditorHTML("m",readOnly,true)}
    <div class="modal-foot"><button class="mini-btn go" id="mDone">Done</button></div>`);
  $("modal").classList.add("wide");
  wireNoteEditor(n,"m",readOnly);
  $("mDone").onclick=closeModal;
  onModalClose=()=>{flushNote(n.id);if(selectedId===n.id)openSide(n.id);};
  setTimeout(()=>{const ta=$("mArea");if(ta&&!readOnly){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}},30);
}
async function openNoteHistory(n){
  await flushNote(n.id);
  openModal(`<h3>${esc(n.name)} · Earlier versions</h3><div id="histList"><div class="spinner"></div></div>
    <div class="modal-foot"><button class="mini-btn" id="hClose">Close</button></div>`);
  $("modal").classList.add("wide");$("hClose").onclick=closeModal;
  onModalClose=()=>{if(selectedId===n.id)openSide(n.id);};
  let r;try{r=await api("note_history",{npc_id:n.id});}catch(e){$("histList").textContent=e.message;return;}
  const list=r.history||[];
  if(!list.length){$("histList").innerHTML='<div class="empty" style="padding:20px">No earlier versions yet. A version is kept every time a saved note is changed.</div>';return;}
  $("histList").innerHTML=list.map((h,i)=>`<div class="hist-item"><div class="hh"><span>${esc(fmtTime(h.saved_at))} · ${wordCount(h.body)} words</span>
    <button class="mini-btn" data-i="${i}" data-tip="Replace the current note with this version (the current one is kept in history)">Restore</button></div><pre>${esc(h.body)}</pre></div>`).join("");
  $("histList").querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{
    const h=list[+b.dataset.i];queueNoteSave(n.id,h.body,{...DEFAULT_STYLE,...(h.style||{})});flushNote(n.id);toast("Version restored");closeModal();
  });
}
/* DM: read every player's notes on one NPC */
async function openPlayerNotes(n){
  openModal(`<h3>Player notes · ${esc(n.name)}</h3><div id="pnList"><div class="spinner"></div></div>
    <div class="modal-foot"><button class="mini-btn" id="pnClose">Close</button></div>`);
  $("modal").classList.add("wide");$("pnClose").onclick=closeModal;
  let r;try{r=await api("dm_notes_for_npc",{npc_id:n.id});}catch(e){$("pnList").textContent=e.message;return;}
  const list=r.notes||[];
  $("pnList").innerHTML=list.length?list.map(x=>{const st={...DEFAULT_STYLE,...(x.style||{})};
    return `<div class="pn"><div class="pn-h"><span>${esc(x.character_name)}</span><span>Edited ${esc(fmtTime(x.updated_at))} · ${wordCount(x.body)} words</span></div>
      <div class="pn-body" style="font-family:${NOTE_FONTS[st.font]||NOTE_FONTS.serif};font-size:${st.size}px;line-height:${st.lh}">${esc(x.body)}</div></div>`;}).join("")
    :'<div class="empty" style="padding:20px">No player has written notes on this NPC yet.</div>';
}

/* tooltips: one floating element, so tips are never clipped by cards or panels */
(function(){
  const tip=$("tip");let cur=null;
  const place=el=>{
    const r=el.getBoundingClientRect(),t=tip.getBoundingClientRect();
    let x=r.left+r.width/2-t.width/2,y=r.top-t.height-8;
    if(y<6)y=r.bottom+8;
    x=Math.max(6,Math.min(x,window.innerWidth-t.width-6));
    tip.style.left=x+"px";tip.style.top=y+"px";
  };
  const show=el=>{cur=el;tip.textContent=el.dataset.tip;tip.classList.add("show");place(el);};
  const hide=()=>{cur=null;tip.classList.remove("show");};
  document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");if(el&&el!==cur)show(el);else if(!el&&cur)hide();});
  document.addEventListener("focusin",e=>{const el=e.target.closest("[data-tip]");if(el)show(el);});
  document.addEventListener("focusout",hide);
  window.addEventListener("scroll",hide,true);
  document.addEventListener("click",hide);
})();

boot();
</script>
